<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <style>
        body, html {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: black; /* Set background to black for letterboxing */
        }

        canvas {
            display: block;
            margin: 0 auto; /* Center horizontally */
        }
    </style>
</head>
<body>

    <div id="mobile-unsupported-message" style="display: block; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: black; color: white; font-family: sans-serif; font-size: 24px; text-align: center; padding-top: 20%;">
        <p>This game is not supported on mobile devices. Please open it on a desktop computer (Linux, macOS, or Windows).</p>
    </div>

    <script type='text/javascript'>
        // Function to detect true mobile (phone/tablet) and touch-only devices
        function isMobileDevice() {
          // 1) Modern Client Hints (Chrome 89+, Edge, etc.)
          if (navigator.userAgentData && typeof navigator.userAgentData.mobile === 'boolean') {
            return navigator.userAgentData.mobile;
          }

          // 2) UA‐string sniffing for true phones & tablets
          const ua = (navigator.userAgent || "").toLowerCase();
          // android.*mobile catches Android phones but not Chrome on Windows
          if (/android.*mobile/.test(ua) ||
              /iphone|ipod/.test(ua) ||
              /windows phone|webos|blackberry|bb10|opera mini/.test(ua) ||
              /ipad/.test(ua)  // iPadOS in desktop-mode may lie, but we still block it
             ) {
            return true;
          }

          // 3) CSS pointer media‐query for coarse pointers (most phones/tablets)
          if (window.matchMedia && window.matchMedia("(pointer: coarse)").matches) {
            return true;
          }

          // 4) Fallback: assume desktop
          return false;
        }

        <!-- Create the canvas that the C++ code will draw into -->
    <canvas id="canvas" oncontextmenu="event.preventDefault()" width="2048" height="2048" style="display: none;"></canvas>

    <script type='text/javascript'>
        // Check if it's a mobile device and display message
        if (!isMobileDevice()) {
            document.getElementById('canvas').style.display = 'block';
            document.getElementById('mobile-unsupported-message').style.display = 'none';
        }

        // Function to resize the canvas while maintaining the aspect ratio
        function resizeCanvas() {
            const canvas = document.getElementById('canvas');
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;

            const aspectRatio = 2048 / 2048;

            let newWidth, newHeight;
            if (windowWidth / windowHeight > aspectRatio) {
                // window is wider than the aspect ratio, scale based on height
                newHeight = windowHeight;
                newWidth = newHeight * aspectRatio;
            } else {
                // window is narrower than the aspect ratio, scale based on width
                newWidth = windowWidth;
                newHeight = newWidth / aspectRatio;
            }

            // Set the canvas size to match the calculated dimensions
            canvas.style.width = newWidth + 'px';
            canvas.style.height = newHeight + 'px';
        }

        // Resize the canvas on window resize events
        window.addEventListener('resize', resizeCanvas, false);

        // Initial canvas size adjustment
        resizeCanvas();

        // Allow the C++ code to access the canvas
        var Module = {
            canvas: document.getElementById('canvas')
        };
    </script>

    <!-- Add the JavaScript glue code (main.js) as generated by Emscripten -->
    <script src="main.js"></script>
</body>
</html>
